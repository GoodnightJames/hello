# Risk Parameters — v3.0 (Small-Account Accumulation Mode)
#
# CONTEXT: $0 start, $100/week deposits. Total capital grows slowly.
# A 50% drawdown on $400 = $200 = two weeks of deposits.
# The real risk isn't losing money — it's not being invested.
#
# These limits are tuned so the system actually TRADES with small amounts
# instead of being paralyzed by percentage-based limits designed for $100k.

position_limits:
  max_risk_per_trade: 0.90          # Deploy up to 90% of available cash per trade
  max_concurrent_positions: 3       # Keep it focused — small account can't diversify much
  averaging_down: false             # NEVER — hard rule (same as before)

daily_limits:
  max_daily_loss: 0.05              # 5% daily — loose enough for real market moves on small $
  max_weekly_drawdown: 0.10         # 10% weekly — $50 on a $500 account, not catastrophic

shutdown_rules:
  consecutive_loss_shutdown: 5      # 5 losses in a row (was 3 — too tight for small account)

regime_throttles:
  vix_threshold: 30                 # VIX > 30 triggers throttle (unchanged)
  vix_position_reduce: 0.50         # Reduce position size by 50% (unchanged)
  spy_below_200d_reduce: 0.50       # Reduce position size by 50% (unchanged)

kill_switch:
  env_var: KILL_SWITCH
  description: "Emergency halt — set to 'true' in .env to stop all trading"

# ─── Performance-Based Risk Modes ───────────────────────────────────────────
# For a small accumulation account, the modes control HOW MUCH of each
# weekly deposit gets deployed, not percentage-of-equity risk.
#
# "risk_per_trade_pct" now means "fraction of available cash to deploy"
# since the whole point is to get $100/week into the market.

risk_modes:
  conservative:
    risk_per_trade_pct: 0.50        # Deploy 50% of cash (hold rest as buffer)
    max_positions: 2
    deploy_deposits: false          # Hold new deposits in cash until regime improves

  normal:
    risk_per_trade_pct: 0.90        # Deploy 90% of cash (keep $10 buffer on $100)
    max_positions: 3
    deploy_deposits: true           # Deploy deposits immediately into best signal

  aggressive:
    risk_per_trade_pct: 0.95        # Deploy 95% of cash
    max_positions: 4
    deploy_deposits: true           # Deploy immediately

# Thresholds for mode transitions
mode_transitions:
  aggressive_trigger:
    min_rolling_return: 0.05        # 5% gain (was 8% — lower bar for small account)
    max_drawdown: 0.06              # Drawdown under 6% (was 4% — more realistic)
    lookback_days: 30               # 30 days (was 60 — faster reaction for small account)

  conservative_trigger:
    max_drawdown: 0.10              # 10% drawdown (was 5% — $50 on $500 isn't scary)
    max_consecutive_losses: 5       # 5 losses (was 4)

  normal_trigger:
    min_rolling_return: 0.0         # Positive returns
    max_drawdown: 0.10              # Drawdown under 10%
    min_days_in_mode: 5             # 5 days (was 10 — faster transitions for small account)

# Trade frequency — more permissive for weekly rebalancing
trade_throttle:
  max_trades_per_week: 6            # Was 8, but with 3 max positions this is plenty

# ─── Go-Live Criteria ─────────────────────────────────────────────────────
# Adjusted for accumulation account reality.
# Paper trading still proves the system works, but with realistic small $.
go_live_criteria:
  min_days_trading: 21              # 3 weeks (was 30 — you're putting in real $ weekly)
  min_trades: 6                     # 6 trades (was 10 — fewer with small account)
  max_drawdown: 0.15               # 15% (was 10% — tighter limits don't make sense on $300)
  min_win_rate: 0.35                # 35% (was 40% — momentum strategies can win less often but bigger)
  min_profit_factor: 1.0            # Gross profit / gross loss >= 1.0 (unchanged)
  max_daily_loss_events: 3          # 3 allowed (was 2 — daily swings are larger % on small $)
