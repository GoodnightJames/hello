# Trading Engine Settings — v2.0 (Small-Account Accumulation Mode)
# All timing in US/Eastern
#
# ACCOUNT MODEL: $0 start, $100/week deposits. No lump sum.
# The weekly deposit IS the capital. Deploy it aggressively.

account:
  mode: accumulation               # "accumulation" (DCA $100/wk) or "lump_sum" ($100k paper)
  initial_capital: 0.0              # Starting with nothing
  weekly_deposit: 100.0             # Core capital input
  deposit_day: monday               # When the $100 lands

universe:
  equities:
    - SPY   # S&P 500
    - QQQ   # Nasdaq 100
    - IWM   # Russell 2000
    - DIA   # Dow Jones
    - AGG   # US Aggregate Bond
    - SHY   # 1-3 Year Treasury (cash proxy)
    - TLT   # 20+ Year Treasury
    - XLF   # Financials
    - XLE   # Energy
    - XLK   # Technology
    - XLV   # Health Care
    - XLI   # Industrials
    - XLP   # Consumer Staples
    - XLU   # Utilities
    - XLB   # Materials
    - XLY   # Consumer Discretionary
    - XLRE  # Real Estate
    - VGK   # Europe
    - VWO   # Emerging Markets
    - GLD   # Gold
    - SLV   # Silver
    - EFA   # EAFE International
    - EEM   # Emerging Markets (alt)
    - VNQ   # REIT
    - HYG   # High Yield Corporate Bond
  crypto:
    # Core tier — liquid, established, reasonable spreads
    - BTC/USD   # Bitcoin — most liquid
    - ETH/USD   # Ethereum — #2 by cap
    - SOL/USD   # Solana — high-cap L1
    - XRP/USD   # Ripple — high liquidity
    - LINK/USD  # Chainlink — oracle infrastructure
    - AVAX/USD  # Avalanche — L1 with decent liquidity
    - DOT/USD   # Polkadot — cross-chain
    # Speculative tier — meme/high-vol, smaller allocation
    - DOGE/USD  # Dogecoin — meme but liquid
    # REMOVED: SHIB/USD, PEPE/USD — extreme spreads, poor cost-adjusted edge

# Two-sleeve architecture:
# - Equity momentum (70%): weekly rebalance, dual momentum, regime-filtered
# - Crypto active (30%): buy every 2h, exit checks every 15min
#
# Virtual sleeve accounting: one broker account, two internal cash ledgers.
# Weekly deposit splits by these ratios. Each sleeve can only spend its own cash.
sleeve_split:
  equity: 0.70                    # 70% of deposits → equity momentum sleeve
  crypto: 0.30                    # 30% of deposits → crypto DCA sleeve

active_strategies:
  equity: momentum_v1
  crypto: crypto_dca_v1

schedule:
  timezone: US/Eastern
  data_ingestion: "08:00"
  signal_scoring: "08:30"
  decision_engine: "09:25"
  market_open: "09:30"
  close_sync: "16:00"
  # Crypto runs 24/7
  # Buy cycles: every 2 hours (rotation through 10 coins)
  # Exit checks: every 15 minutes (fast capture of short-term moves)
  crypto_buy_interval_hours: 2
  crypto_exit_interval_minutes: 15
  crypto_run_on_startup: true

rebalance:
  strategy_rebalance: weekly        # Rebalance weekly to align with deposits
  equal_weight_rebalance: quarterly
  drift_threshold: 0.05             # 5% drift — tighter since account is small

database:
  url: "sqlite:///trading.db"

logging:
  directory: logs
  level: INFO
  format: json
