# Trading Engine Settings — v2.0 (Small-Account Accumulation Mode)
# All timing in US/Eastern
#
# ACCOUNT MODEL: $0 start, $100/week deposits. No lump sum.
# The weekly deposit IS the capital. Deploy it aggressively.

account:
  mode: accumulation               # "accumulation" (DCA $100/wk) or "lump_sum" ($100k paper)
  initial_capital: 0.0              # Starting with nothing
  weekly_deposit: 100.0             # Core capital input
  deposit_day: monday               # When the $100 lands

universe:
  equities:
    - SPY   # S&P 500
    - QQQ   # Nasdaq 100
    - IWM   # Russell 2000
    - DIA   # Dow Jones
    - AGG   # US Aggregate Bond
    - SHY   # 1-3 Year Treasury (cash proxy)
    - TLT   # 20+ Year Treasury
    - XLF   # Financials
    - XLE   # Energy
    - XLK   # Technology
    - XLV   # Health Care
    - XLI   # Industrials
    - XLP   # Consumer Staples
    - XLU   # Utilities
    - XLB   # Materials
    - XLY   # Consumer Discretionary
    - XLRE  # Real Estate
    - VGK   # Europe
    - VWO   # Emerging Markets
    - GLD   # Gold
    - SLV   # Silver
    - EFA   # EAFE International
    - EEM   # Emerging Markets (alt)
    - VNQ   # REIT
    - HYG   # High Yield Corporate Bond
  crypto:
    - BTC/USD   # Bitcoin
    - ETH/USD   # Ethereum
    - SOL/USD   # Solana
    - AVAX/USD  # Avalanche
    - LINK/USD  # Chainlink
    - DOT/USD   # Polkadot

active_strategy: momentum_v1

schedule:
  timezone: US/Eastern
  data_ingestion: "08:00"
  signal_scoring: "08:30"
  decision_engine: "09:25"
  market_open: "09:30"
  close_sync: "16:00"
  # Crypto runs 24/7 — every 2 hours (12 cycles/day)
  crypto_interval_hours: 2
  crypto_run_on_startup: true

rebalance:
  strategy_rebalance: weekly        # Rebalance weekly to align with deposits
  equal_weight_rebalance: quarterly
  drift_threshold: 0.05             # 5% drift — tighter since account is small

database:
  url: "sqlite:///trading.db"

logging:
  directory: logs
  level: INFO
  format: json
