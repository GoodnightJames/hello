# Crypto Active Trading Strategy — v3.0.0
# Aggressive rotation through volatile altcoins with fast exits.
#
# PHILOSOPHY: Small positions ($10), many coins, fast cycling.
# Buy via rotation, check exits every 15 minutes, take profit at 5%.
# Capital recycles back to the sleeve immediately for re-deployment.
# More coins = more volatility = more take-profit triggers = compounding.
#
# BUY LOGIC: Rotation through 10 coins. Each cycle buys ONE coin.
# With 2-hour buy cycles, each coin gets bought every 20 hours.
#
# SELL LOGIC: Checked every 15 MINUTES (not every buy cycle):
# 1. Take-profit at 5% — fast capture, recycle capital
# 2. Trailing stop at 4% from peak — protect gains
# 3. Hard stop at 7% loss — cut losers fast
#
# MATH: If a coin moves 5% in 24h (common for alts), and we check
# every 15 min, we catch it within ~15 min of hitting target.
# $10 × 5% = $0.50 profit. Recycle $10.50, buy again.
# If this happens 3x/week across 10 coins = $1.50/week compounding.

version: "3.0.0"
name: crypto_active
description: >
  Aggressive crypto rotation with fast exits. Buys via rotation
  across 10 volatile coins, checks exits every 15 minutes.
  Take profit at 5%, recycle capital immediately.

instruments:
  # Mix of large-cap and high-volatility altcoins.
  # More coins = more chances for one to hit take-profit.
  assets:
    - symbol: BTC/USD     # Bitcoin — baseline, most liquid
    - symbol: ETH/USD     # Ethereum — #2 by market cap
    - symbol: SOL/USD     # Solana — high volatility L1
    - symbol: DOGE/USD    # Dogecoin — meme coin, very volatile
    - symbol: AVAX/USD    # Avalanche — volatile L1
    - symbol: LINK/USD    # Chainlink — oracle play, swings hard
    - symbol: DOT/USD     # Polkadot — volatile mid-cap
    - symbol: SHIB/USD    # Shiba Inu — meme coin, huge swings
    - symbol: PEPE/USD    # Pepe — meme coin, extreme volatility
    - symbol: XRP/USD     # Ripple — news-driven volatility

allocation:
  # $10 per buy cycle, rotating through 10 coins
  # Buys happen every 2 hours (not every 15 min — need to spread capital)
  dollars_per_cycle: 10.00
  min_trade_dollars: 10.00  # Alpaca crypto minimum order size

  # Sleeve gets 30% of total capital allocation
  sleeve_pct: 0.30

# ── Exit Rules ─────────────────────────────────────────────────────
# Checked every 15 MINUTES — this is the key speed advantage.
# Fast checks catch short-term moves that 8-hour checks miss entirely.
exits:
  take_profit:
    enabled: true
    target_pct: 0.05         # 5% — fast capture, recycle capital
    # Why 5%: Altcoins regularly move 5-10% in a day. Catching 5%
    # and recycling beats waiting for 8% and missing it.

  trailing_stop:
    enabled: true
    stop_pct: 0.04           # 4% drop from peak triggers sell
    min_gain_to_activate: 0.02  # Arm after just 2% gain
    # Why 4%: Tighter than before — we want to protect small gains.
    # If a coin runs up 6% then drops 4%, we still lock in ~2%.

  hard_stop:
    enabled: true
    stop_pct: 0.07           # 7% loss = cut it, move on
    # Why 7%: On $10, that's $0.70 max loss. Fast exit preserves
    # capital for the next rotation buy.
