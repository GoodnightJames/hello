# Crypto DCA Strategy — v1.1.0
# Simple dollar-cost averaging into crypto assets.
#
# RATIONALE: Momentum strategies avoid falling markets (correct behavior),
# but that means they miss bottoms. DCA accumulates during downtrends so
# you're positioned when momentum eventually turns positive.
#
# This is a separate sleeve from equity momentum — different market,
# different time horizon, different logic.
#
# ROTATION MODEL (v1.1): With a $30/week crypto budget, each cycle buys
# ONE coin rotating through the list. Alpaca requires $10 minimum per
# crypto order, so each cycle deploys $10 when cash is available.
# Every 8h = 3 cycles/day. Cash guard skips cycles when sleeve < $10.

version: "1.1.0"
name: crypto_dca_core
description: >
  Dollar-cost average into crypto assets every cycle. No momentum filter,
  no regime filter. Rotation model: each cycle buys ONE coin, cycling
  through the list. Ensures every trade clears Alpaca's $1 minimum.

instruments:
  # Top 3 by market cap — concentrated for small account.
  # With rotation, each coin gets bought every 3rd cycle (~once/day).
  assets:
    - symbol: BTC/USD     # Bitcoin — dominant, most liquid
    - symbol: ETH/USD     # Ethereum — #2 by market cap
    - symbol: SOL/USD     # Solana — high-growth L1

allocation:
  # Full cycle amount goes to ONE coin (rotation, not split)
  # Cash guard in run_crypto_dca_cycle skips if sleeve cash < $10
  dollars_per_cycle: 10.00
  min_trade_dollars: 10.00  # Alpaca crypto minimum order size

  # Sleeve gets 30% of total capital allocation
  # (equity momentum gets the other 70%)
  sleeve_pct: 0.30
