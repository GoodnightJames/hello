# Crypto DCA + Exit Strategy — v2.0.0
# Dollar-cost average into crypto, WITH active exit management.
#
# RATIONALE: DCA accumulates positions over time. Without exits, you're
# just buying and hoping. With take-profit and trailing stops, you lock
# in gains, recycle capital back to the sleeve, and buy again on the
# next cycle. This turns $30/week into a capital recycling engine.
#
# BUY LOGIC: Rotation model — each cycle buys ONE coin, rotating
# through the list. Alpaca requires $10 minimum per crypto order.
#
# SELL LOGIC: Every cycle checks all open crypto positions for:
# 1. Take-profit: sell when up X% from cost basis
# 2. Trailing stop: sell when price drops Y% from peak (after arming)
# 3. Hard stop: sell when down Z% from entry (unconditional)
#
# Capital from sells goes back to the crypto sleeve for re-deployment.

version: "2.0.0"
name: crypto_dca_core
description: >
  Dollar-cost average into crypto with active exit management.
  Buys on rotation, sells on take-profit or trailing stop.
  Proceeds recycle back to sleeve for re-deployment.

instruments:
  # Top 3 by market cap — concentrated for small account.
  # With rotation, each coin gets bought every 3rd cycle (~once/day).
  assets:
    - symbol: BTC/USD     # Bitcoin — dominant, most liquid
    - symbol: ETH/USD     # Ethereum — #2 by market cap
    - symbol: SOL/USD     # Solana — high-growth L1

allocation:
  # Full cycle amount goes to ONE coin (rotation, not split)
  # Cash guard in run_crypto_dca_cycle skips if sleeve cash < $10
  dollars_per_cycle: 10.00
  min_trade_dollars: 10.00  # Alpaca crypto minimum order size

  # Sleeve gets 30% of total capital allocation
  # (equity momentum gets the other 70%)
  sleeve_pct: 0.30

# ── Exit Rules ─────────────────────────────────────────────────────
# Checked every cycle (every 8 hours) against live Alpaca positions.
# Multiple exits can fire in the same cycle for different positions.
exits:
  # Take-profit: sell entire position when gain exceeds threshold
  take_profit:
    enabled: true
    target_pct: 0.08         # Sell when up 8% from avg cost basis
    # Why 8%: Crypto moves fast. 8% is achievable in days/weeks,
    # and locking it in recycles capital. Better than holding for
    # 50% and giving it all back in a crash.

  # Trailing stop: sell when price drops from peak (protects gains)
  trailing_stop:
    enabled: true
    stop_pct: 0.05           # Sell if price drops 5% from high-water mark
    min_gain_to_activate: 0.03  # Only arm after 3% gain from entry
    # Why 5%: Crypto is volatile — tighter than the 8% equity stop.
    # We want to capture the move, not ride it back down.

  # Hard stop: unconditional floor (no arming needed)
  hard_stop:
    enabled: true
    stop_pct: 0.10           # Sell if down 10% from entry, period
    # Why 10%: Limits max loss per position. On $10 buys, that's
    # $1 max loss. Preserves capital for next cycle.
