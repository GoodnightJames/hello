# Crypto Active Trading Strategy — v5.0.0
# Risk-adjusted momentum with cost-aware scoring and ATR-scaled exits.
#
# CHANGES FROM v4:
# 1. Z-score momentum scoring replaces raw return + vol weighting
# 2. Volatility PENALTY (not bonus) — stops overpaying for noise
# 3. Overextension penalty — avoids chasing the most extended candle
# 4. Cost adjustment — subtracts estimated round-trip fees from score
# 5. Signal threshold — NO FORCED BUYS. Cash is a position.
# 6. ATR-scaled exits — adapts to each coin's actual volatility
# 7. Cleaner universe — core + speculative tiers
#
# SCORING FORMULA:
#   Gate 1 (ranking): z-score momentum + penalties > threshold
#   Gate 2 (cost):    expected_edge / cost_hurdle >= min_edge_ratio
#   Both gates must pass to trigger a buy.
#
#   momentum   = 0.45*z(12h) + 0.35*z(1d) + 0.20*z(3d)
#   penalties  = -0.35*z(realized_vol) - 0.25*z(dist_above_ema20)
#   raw_score  = momentum + penalties
#   → Gate 1: raw_score > min_score_threshold (0.10)
#
#   expected_edge = mom_strength * atr_pct * continuation_fraction
#   edge_ratio    = expected_edge / cost_hurdle
#   → Gate 2: edge_ratio >= min_edge_ratio (1.5)

version: "5.0.0"
name: crypto_active
description: >
  Risk-adjusted crypto momentum. Z-score based scoring with volatility
  and overextension penalties. Cost-adjusted. ATR-scaled exits.
  No forced buys — holds cash when no signal clears threshold.

instruments:
  # CORE TIER: liquid, established, tighter spreads
  # SPECULATIVE TIER: higher vol, wider spreads, smaller allocation
  assets:
    - symbol: BTC/USD     # Core — most liquid crypto
      tier: core
    - symbol: ETH/USD     # Core — #2 by cap
      tier: core
    - symbol: SOL/USD     # Core — high-cap L1
      tier: core
    - symbol: XRP/USD     # Core — high liquidity
      tier: core
    - symbol: LINK/USD    # Core — oracle infrastructure
      tier: core
    - symbol: AVAX/USD    # Core — L1 with decent liquidity
      tier: core
    - symbol: DOT/USD     # Core — cross-chain
      tier: core
    - symbol: DOGE/USD    # Speculative — meme but liquid
      tier: speculative

allocation:
  # $10 per buy cycle — only deployed if score > threshold
  dollars_per_cycle: 10.00
  min_trade_dollars: 10.00  # Alpaca crypto minimum order size
  sleeve_pct: 0.30

# ── Scoring Parameters ────────────────────────────────────────────
scoring:
  # Minimum score to trigger a buy. Below this → hold cash.
  # Tuned so that ~40-60% of cycles produce a buy (not 100%).
  min_score_threshold: 0.10

  # Z-score momentum weights (must sum to 1.0)
  weight_12h: 0.45      # Most recent momentum (proxied from daily)
  weight_1d: 0.35       # 1-day return
  weight_3d: 0.20       # 3-day trend

  # Penalty weights (subtracted from momentum)
  vol_penalty_weight: 0.35          # Higher vol = higher penalty
  overextension_penalty_weight: 0.25  # Far above EMA = penalty

  # Position penalty multiplier for already-held coins
  position_penalty: 0.30

  # EMA period for overextension calculation
  ema_period: 20

  # Cost gate: ATR-calibrated momentum continuation
  # mom_strength = vol-normalized momentum (how many daily-vol units is the move)
  # expected_edge = mom_strength * atr_pct * continuation_fraction
  # Must clear cost_hurdle by this multiple to trigger a buy
  continuation_fraction: 0.30   # Conservative: expect to capture 30% of momentum move
  min_edge_ratio: 1.5           # Need 1.5x cost to justify the trade

# ── Exit Rules — ATR-Scaled ───────────────────────────────────────
# Exits adapt to each coin's volatility via ATR (Average True Range).
# BTC (2% ATR) gets tighter stops than DOGE (5% ATR).
exits:
  atr_period: 14           # Lookback for ATR computation

  take_profit:
    enabled: true
    atr_multiplier: 2.0    # Take profit at 2x ATR from entry
    min_pct: 0.03          # Floor: never take profit below 3%
    max_pct: 0.12          # Cap: don't wait for >12%

  trailing_stop:
    enabled: true
    atr_multiplier: 1.5    # Trail at 1.5x ATR from peak
    activation_atr_mult: 1.0  # Arm after +1 ATR gain from entry

  hard_stop:
    enabled: true
    atr_multiplier: 1.25   # Stop at 1.25x ATR below entry
    min_pct: 0.03          # Floor: never stop tighter than 3%
    max_pct: 0.10          # Cap: never let a position lose >10%
