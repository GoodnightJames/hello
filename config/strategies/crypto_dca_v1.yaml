# Crypto Active Trading Strategy — v4.0.0
# Momentum-based coin selection with fast exits.
#
# PHILOSOPHY: Buy the coin moving hardest RIGHT NOW. Not a blind rotation —
# the engine scores all 10 coins by momentum + volatility every cycle and
# picks the one most likely to hit 5% take-profit quickly.
#
# BUY LOGIC: Every 2 hours, score all coins:
#   - 1-day return (recent momentum — is it moving up?)
#   - 3-day return (short-term trend)
#   - Daily volatility (big swings = faster path to 5%)
#   - Position penalty (deprioritize coins already held — spread risk)
#   → Buy the highest-scoring coin for $10
#
# SELL LOGIC: Checked every 15 MINUTES:
# 1. Take-profit at 5% — fast capture, recycle capital
# 2. Trailing stop at 4% from peak — protect gains
# 3. Hard stop at 7% loss — cut losers fast
#
# MATH: If DOGE is up 3% today with 6% daily volatility, it scores higher
# than BTC which is flat with 1% volatility. We buy the mover, not the sleeper.

version: "4.0.0"
name: crypto_active
description: >
  Momentum-based crypto trading. Scores all coins by recent momentum
  and volatility, buys the best candidate each cycle. Checks exits
  every 15 minutes. Take profit at 5%, recycle capital immediately.

instruments:
  # Mix of large-cap and high-volatility altcoins.
  # More coins = more chances for one to be moving hard.
  assets:
    - symbol: BTC/USD     # Bitcoin — baseline, most liquid
    - symbol: ETH/USD     # Ethereum — #2 by market cap
    - symbol: SOL/USD     # Solana — high volatility L1
    - symbol: DOGE/USD    # Dogecoin — meme coin, very volatile
    - symbol: AVAX/USD    # Avalanche — volatile L1
    - symbol: LINK/USD    # Chainlink — oracle play, swings hard
    - symbol: DOT/USD     # Polkadot — volatile mid-cap
    - symbol: SHIB/USD    # Shiba Inu — meme coin, huge swings
    - symbol: PEPE/USD    # Pepe — meme coin, extreme volatility
    - symbol: XRP/USD     # Ripple — news-driven volatility

allocation:
  # $10 per buy cycle — goes to the highest-scoring coin
  dollars_per_cycle: 10.00
  min_trade_dollars: 10.00  # Alpaca crypto minimum order size

  # Sleeve gets 30% of total capital allocation
  sleeve_pct: 0.30

# ── Exit Rules ─────────────────────────────────────────────────────
# Checked every 15 MINUTES — fast checks catch short-term moves.
exits:
  take_profit:
    enabled: true
    target_pct: 0.05         # 5% — fast capture, recycle capital

  trailing_stop:
    enabled: true
    stop_pct: 0.04           # 4% drop from peak triggers sell
    min_gain_to_activate: 0.02  # Arm after just 2% gain

  hard_stop:
    enabled: true
    stop_pct: 0.07           # 7% loss = cut it, move on
