# Dual Momentum / Trend Core Strategy — v2.0.0 (Small-Account Accumulation)
# Academic basis: Antonacci (2014) Dual Momentum
#
# KEY CHANGE: allocation.capital_pct raised from 60% to 95%.
# With $100/week, holding 40% in cash is a waste. Deploy almost everything.
# The safety net is the regime filter and the momentum signal itself —
# when momentum is negative, we rotate to bonds, not cash.

version: "2.0.0"
name: dual_momentum_trend_core
description: >
  Dual momentum with absolute and relative momentum signals.
  Holds the highest-ranked asset when absolute momentum is positive,
  otherwise rotates to safe assets (AGG/SHY). Tuned for small
  accumulation accounts deploying $100/week.

instruments:
  risk_assets:
    - SPY   # S&P 500
    - QQQ   # Nasdaq 100
  safe_assets:
    - AGG   # US Aggregate Bond
    - SHY   # 1-3 Year Treasury (cash proxy / T-bill proxy)

signals:
  lookback_days: 252              # 12-month return (~252 trading days)
  benchmark: SHY                  # T-bill proxy for absolute momentum
  absolute_momentum: true         # Compare return vs T-bills
  relative_momentum: true         # Rank assets by return

regime_filter:
  enabled: true
  indicator: spy_200d_sma         # Hold safe assets when SPY below 200-day SMA
  reference_symbol: SPY

allocation:
  capital_pct: 0.95               # 95% of portfolio (was 60% — can't afford idle cash)
  min_trade_dollars: 1.00         # Alpaca supports fractional shares down to $1

rebalance:
  frequency: weekly               # Weekly to align with deposit cadence (was monthly)
  expected_turnover: "1-2 trades per week"
  typical_holding_period: "1-4 weeks"
