# Dual Momentum / Trend Core Strategy — v5.0.0 (Simplified)
# Academic basis: Antonacci (2014) Dual Momentum
#
# v5.0 CHANGES:
# - Removed crypto from equity momentum universe (crypto has its own DCA sleeve)
# - Disabled RSI(2) filter (2-day indicator conflicts with 12-month strategy)
# - Disabled fast exit / daily trailing stops (let momentum be momentum)
# - Skip recent month in lookback (months 2-12, not 1-12) per Jegadeesh & Titman
# - Sleeve gets 70% of capital (crypto DCA gets 30%)

version: "5.0.0"
name: dual_momentum_trend_core
description: >
  Pure dual momentum for equities only. Absolute + relative momentum,
  6-month confirmation, weekly rebalance. No short-term filters.
  Crypto is handled by a separate DCA sleeve.

instruments:
  # Equity-only universe — crypto moved to crypto_dca sleeve
  risk_assets:
    - SPY   # S&P 500
    - QQQ   # Nasdaq 100
    - IWM   # Russell 2000 (small-cap momentum)
    - XLK   # Technology sector
    - XLE   # Energy sector
    - XLF   # Financials sector
    - XLV   # Health Care sector
    - XLI   # Industrials sector
    - XLY   # Consumer Discretionary
    - GLD   # Gold (commodity momentum)
    - VNQ   # REITs (real estate momentum)
    - EFA   # International developed
  safe_assets:
    - AGG   # US Aggregate Bond
    - SHY   # 1-3 Year Treasury (cash proxy / T-bill proxy)
    - TLT   # 20+ Year Treasury (long bonds for rate-cut environments)

signals:
  lookback_days: 252              # 12-month return (~252 trading days)
  benchmark: SHY                  # T-bill proxy for absolute momentum

  # Skip the most recent month (Jegadeesh & Titman reversal effect)
  # Months 2-12 have stronger momentum signal than months 1-12
  skip_recent_days: 21            # Skip ~1 month of recent returns

  absolute_momentum: true         # Compare return vs T-bills
  relative_momentum: true         # Rank assets by return

  # 6-month confirmation — the one short-term filter worth keeping
  # Prevents buying dying trends where 12m is positive but 6m is negative
  multi_timeframe:
    enabled: true
    require_6m_positive: true     # 6-month return must also beat benchmark
    require_3m_positive: false    # 3-month not required (too noisy)

  # Minimum edge: skip signals where excess return is trivially small
  min_edge_pct: 0.02             # Require 2% excess return over benchmark

  # RSI filter DISABLED — 2-day indicator has no business overriding 12-month signal
  rsi_filter:
    enabled: false

  # Signal strength: composite score for position sizing
  signal_strength:
    enabled: true
    weight_12m: 0.50             # 12-month return (primary)
    weight_6m: 0.30              # 6-month return (confirmation)
    weight_3m: 0.20              # 3-month return (acceleration)

  # Multi-position: hold top 3 qualified assets simultaneously
  max_buy_signals: 3

  # Fast exit DISABLED — let momentum run on its natural 12-month cycle
  # The 6-month confirmation filter already prevents late entries
  fast_exit:
    enabled: false
    cooldown_days: 5

regime_filter:
  enabled: true
  indicator: spy_200d_sma         # Hold safe assets when SPY below 200-day SMA
  reference_symbol: SPY

allocation:
  capital_pct: 0.95               # 95% of sleeve allocation
  sleeve_pct: 0.70                # This sleeve gets 70% of total capital
  min_trade_dollars: 1.00         # Alpaca supports fractional shares down to $1

rebalance:
  frequency: weekly               # Full re-rank weekly (Fridays)
  expected_turnover: "1-2 trades per week"
  typical_holding_period: "4-12 weeks"
